tasks:
  - id: mootdx_interface_health
    name: Retained Mootdx interface health
    level: daily
    quality_goal: Independently verify stock list, XDXR, realtime quotes, minute bars, financial catalog, and representative quarterly financial content.
    owner: SimTradeData
    schedule: daily 07:17 and 15:17 UTC
    trigger: GitHub Actions schedule or workflow_dispatch
    systemd_timer:
    systemd_service:
    command: uv run --frozen python -m scripts.check_mootdx_interfaces --timeout 90 --json-output reports/mootdx-interfaces.json
    working_directory: repository checkout
    logs: GitHub Actions mootdx-interfaces artifact
    may_contact_baostock: false
    may_publish: false
    publish_targets_allowed:
    failure_policy: Preserve per-interface results; no repair or publishing. Catalog and quarterly-content checks report separate outcomes.

  - id: data_source_health
    name: Read-only data source health
    level: daily
    quality_goal: Detect unavailable providers, daily-bar schema changes, and stale market data without fallback.
    owner: SimTradeData
    schedule: daily 07:17 and 15:17 UTC
    trigger: GitHub Actions schedule or workflow_dispatch
    systemd_timer:
    systemd_service:
    command: uv run --frozen python -m scripts.check_data_sources --timeout 90 --attempts 2 --json-output reports/data-sources.json
    working_directory: repository checkout
    logs: GitHub Actions summary and data-source-health artifact
    may_contact_baostock: true
    may_publish: false
    publish_targets_allowed:
    failure_policy: Fail the workflow and preserve the report; no repair, publishing, or unbounded retry.

  - id: daily_cn_data
    name: CN daily data refresh
    level: daily
    quality_goal: Publish only fresh CN market and valuation data that passes integrity gates.
    owner: SimTradeData
    schedule: Mon..Fri 22:30 Asia/Shanghai
    trigger: systemd timer
    systemd_timer: simtradedata-daily-cn.timer
    systemd_service: simtradedata-daily-cn.service
    command: cd "$SIMTRADE_DATA_DIR" && MARKET=cn PUBLISH_TARGETS=local DOWNLOAD_ATTEMPTS=3 INTEGRITY_STRICT=1 bash scripts/run_daily.sh
    working_directory: $SIMTRADE_DATA_DIR
    logs: $SIMTRADE_DATA_DIR/logs/daily
    may_contact_baostock: true
    may_publish: true
    publish_targets_allowed: local, cos
    failure_policy: Do not publish; keep previous release; inspect latest logs/daily report.

  - id: weekly_cn_quality_repair
    name: CN weekly quality repair
    level: weekly
    quality_goal: Improve historical corporate-action and financial-data quality outside the daily path.
    owner: SimTradeData
    schedule: manual first; weekly Saturday 02:00 Asia/Shanghai after validation
    trigger: systemd timer template; enable manually after validation
    systemd_timer: simtradedata-weekly-cn-quality-repair.timer
    systemd_service: simtradedata-weekly-cn-quality-repair.service
    command: cd "$SIMTRADE_DATA_DIR" && .venv/bin/python scripts/download.py --source mootdx --skip-mootdx-ohlcv
    working_directory: $SIMTRADE_DATA_DIR
    logs: $SIMTRADE_DATA_DIR/logs/quality
    may_contact_baostock: true
    may_publish: false
    publish_targets_allowed:
    failure_policy: Do not retry in a loop; inspect failed symbols and rerun a bounded repair.

  - id: monthly_cn_reconcile
    name: CN monthly reconcile
    level: monthly
    quality_goal: Detect long-term drift without mutating data.
    owner: SimTradeData
    schedule: first Sunday monthly 03:00 Asia/Shanghai
    trigger: systemd timer template; enable manually after validation
    systemd_timer: simtradedata-monthly-cn-reconcile.timer
    systemd_service: simtradedata-monthly-cn-reconcile.service
    command: cd "$SIMTRADE_DATA_DIR" && .venv/bin/python scripts/check_integrity.py --market cn --strict --json-output logs/validation/monthly_cn_reconcile.json
    working_directory: $SIMTRADE_DATA_DIR
    logs: $SIMTRADE_DATA_DIR/logs/validation
    may_contact_baostock: false
    may_publish: false
    publish_targets_allowed:
    failure_policy: Open a data-quality ticket; do not auto-repair from this task.

  - id: monthly_cn_db_rebuild
    name: CN monthly DuckDB rebuild
    level: monthly
    quality_goal: Compact MVCC history so the working database does not exhaust the data disk.
    owner: SimTradeData
    schedule: first Saturday monthly 03:00 Asia/Shanghai
    trigger: systemd timer
    systemd_timer: simtradedata-rebuild-db.timer
    systemd_service: simtradedata-rebuild-db.service
    command: cd "$SIMTRADE_DATA_DIR" && MARKET=cn bash scripts/rebuild_db.sh
    working_directory: $SIMTRADE_DATA_DIR
    logs: journalctl -u simtradedata-rebuild-db.service
    may_contact_baostock: false
    may_publish: false
    publish_targets_allowed:
    failure_policy: Keep the previous database (imports go to a side file and are renamed only after verification); inspect the service log and rerun manually.

  - id: manual_cn_recovery
    name: CN manual recovery
    level: manual
    quality_goal: Recover from missing data, bad releases, or baseline rebuilds.
    owner: SimTradeData
    schedule: manual only
    trigger: operator
    systemd_timer:
    systemd_service:
    command: Use the incident-specific SimTradeData command; record it in the incident note.
    working_directory: $SIMTRADE_DATA_DIR
    logs: $SIMTRADE_DATA_DIR/logs
    may_contact_baostock: true
    may_publish: true
    publish_targets_allowed: local, cos
    failure_policy: Stop and preserve logs; no automatic second attempt.
