[project]
name = "simtradedata"
version = "1.2.0"
description = "为 simtradelab 项目提供数据支持的配套工具库"
authors = [
    {name = "kayou",email = "kayou@duck.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "baostock>=0.9.1,<1.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "duckdb>=1.2.0,<2.0.0",
    "pyarrow>=19.0.0,<20.0.0",
    "yfinance>=0.2.0",
    "mootdx>=0.11.7,<0.12.0",
    "cachetools>=6.2.1,<7.0.0",
    "pandas>=2.3.1,<3.0.0",
    "numpy<2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "black>=25.1.0,<26.0.0",
    "isort>=6.0.1,<7.0.0",
    "autoflake>=2.3.1,<3.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-benchmark>=5.1.0,<6.0.0",
    "ruff>=0.15.19,<0.16.0",
]
